name: Package WiiU GamePad RC source

on:
  workflow_dispatch:
  push:
    branches:
      - feature/auto-display-profile
    paths:
      - .github/workflows/package-rc-source.yml
      - files/**
      - docs/**
      - install.sh
      - uninstall.sh
      - README.md
      - RELEASE_NOTES.md
      - VERSION
      - LICENSE

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage release tree
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          STAGE="out/batocera-wiiu-gamepad-v$VERSION"
          mkdir -p "$STAGE"
          cp -a install.sh uninstall.sh README.md RELEASE_NOTES.md VERSION LICENSE "$STAGE/"
          cp -a files docs "$STAGE/"
          rm -f "$STAGE/files/sunshine/"*.AppImage
          find "$STAGE" -type f \( -name '*.rpl' -o -name '*.pem' -o -name 'sunshine_state.json' -o -name 'apps.json' \) -print -quit | \
            grep -q . && { echo "Forbidden release content found"; exit 1; } || true
          find "$STAGE" -type f -print0 | sort -z | xargs -0 sha256sum > "$STAGE/SOURCE_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: batocera-wiiu-gamepad-rc-source
          path: out/
          if-no-files-found: error
