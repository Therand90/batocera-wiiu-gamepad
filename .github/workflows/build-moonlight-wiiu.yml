name: Build Moonlight WiiU GamePad

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone pinned Moonlight Android source
        run: |
          git clone --recursive https://github.com/moonlight-stream/moonlight-android.git moonlight
          cd moonlight
          git checkout b48494cb96bff23d8886c4775cc4f39a1075495d
          git submodule update --init --recursive
          git rev-parse HEAD | tee ../MOONLIGHT_UPSTREAM_COMMIT.txt

      - name: Install required Android SDK components
        run: |
          SDKROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865"

          if [ -d "$SDKROOT/platforms/android-37.0" ] && [ ! -e "$SDKROOT/platforms/android-37" ]; then
            ln -s "$SDKROOT/platforms/android-37.0" "$SDKROOT/platforms/android-37"
          fi

      - name: Patch Moonlight for Wii U GamePad
        run: python3 build/moonlight/patch.py moonlight

      - name: Show patch diff
        working-directory: moonlight
        run: |
          git diff -- \
            app/build.gradle \
            app/src/main/java/com/limelight/preferences/PreferenceConfiguration.java \
            app/src/main/res/xml/preferences.xml \
            app/src/main/java/com/limelight/binding/input/touch/AbsoluteTouchContext.java \
            app/src/main/java/com/limelight/Game.java \
            app/src/main/res/layout/activity_game.xml

      - name: Build debug APK
        working-directory: moonlight
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRootDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p out
          APK="$(find moonlight/app/build/outputs/apk -type f -name '*nonRoot*debug*.apk' | head -n1)"
          test -n "$APK"
          cp "$APK" out/Moonlight-WiiU-GamePad.apk
          cp MOONLIGHT_UPSTREAM_COMMIT.txt out/
          sha256sum out/Moonlight-WiiU-GamePad.apk | tee out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-WiiU-GamePad
          path: out/
          if-no-files-found: error
